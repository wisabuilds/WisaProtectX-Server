name: WisaProtectX Keybox Sync & Harvest

on:
  schedule:
    # Runs every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub web UI anytime

permissions:
  contents: write

jobs:
  harvest-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Harvester & Validator
        run: |
          python3 harvester.py

      - name: Commit and push updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add key status meta.json
          if git diff --staged --quiet; then
            echo "No keybox updates detected. Nothing to commit."
          else
            git commit -m "chore(keybox): update active keybox payload [skip ci]"
            git push
            echo "✓ Pushed fresh keybox update to main."
          fi
